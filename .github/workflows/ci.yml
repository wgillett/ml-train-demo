name: CI

on:
  push:
    branches: [main]
  # The GPU image is several GB and only needed for an EKS GPU demo, so
  # it's built on demand rather than on every push.
  workflow_dispatch:
    inputs:
      torch_variant:
        description: "Which torch build to bake into the image"
        type: choice
        options: [cpu, gpu]
        default: gpu

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push training image
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          TORCH_VARIANT: ${{ inputs.torch_variant || 'cpu' }}
          IMAGE_TAG: ${{ inputs.torch_variant == 'gpu' && format('gpu-{0}', github.sha) || github.sha }}
        run: |
          docker build --build-arg TORCH_VARIANT="$TORCH_VARIANT" -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" .
          docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
