[project]
name = "ml-train-demo"
version = "0.1.0"
description = "Minimal containerized ML training demo for the infra/MLOps platform seam"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
]

[project.scripts]
train = "ml_train_demo.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_train_demo"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
